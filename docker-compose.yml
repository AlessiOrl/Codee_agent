x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-3}

services:
  postgres:
    image: postgres:16
    command:
      - postgres
      - -c
      - log_min_messages=${POSTGRES_LOG_MIN_MESSAGES:-warning}
      - -c
      - log_min_error_statement=${POSTGRES_LOG_MIN_ERROR_STATEMENT:-error}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_password}
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
    logging: *default-logging
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.4
    environment:
      RUST_LOG: ${QDRANT_LOG_LEVEL:-warn}
      QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL:-warn}
    logging: *default-logging
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  agent-api:
    build: ./agent-api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://agent:agent_password@postgres:5432/agent_db}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    logging: *default-logging
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json, urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=5)); raise SystemExit(0 if data.get('status') == 'ok' else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  telegram-bot:
    build: ./telegram-bot
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_API_URL: ${AGENT_API_URL:-http://agent-api:8000}
      AGENT_API_KEY: ${AGENT_API_KEY:-abcdef1234567890}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    logging: *default-logging
    depends_on:
      agent-api:
        condition: service_healthy
    volumes:
      - telegram_bot_data:/data

volumes:
  postgres_data:
  qdrant_data:
  telegram_bot_data:
